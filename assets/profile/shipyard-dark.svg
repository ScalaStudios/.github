<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-label="Shipyard: source, pipeline, job, then ARTIFACT, PACKAGE, IMAGE, then release and deployment.">
  <style>
    svg { --bg:#111111;--raised:#1C1917;--border:#2A2724;--line:#44403A;--dot:#FFFFFF;--fg:#FFFFFF;--fg2:#D3D0CC;--fg3:#A8A29B;--ember:#FA7E26;--glow:0.16;--dots:0.16 }
    .label { font: 600 16px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .14em; fill: var(--fg3); }
    .chip-text { font: 600 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .1em; fill: var(--fg2); }
    .base { stroke: var(--line); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .tail, .head { stroke-linecap: round; animation-timing-function: linear; animation-iteration-count: infinite; animation-duration: 8.0s; }
    .tail { stroke: url(#heat); stroke-width: 4; stroke-dasharray: 150 4000; stroke-dashoffset: 152; opacity: .4; }
    .head { stroke: url(#heat); stroke-width: 6; stroke-dasharray: 28 4000; stroke-dashoffset: 30; }
    .stop { fill: var(--bg); stroke: var(--line); stroke-width: 3; }
    .planned { stroke: url(#planned); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 11; }
    .chip { fill: var(--raised); stroke: var(--line); stroke-width: 1.5; }
    .lit { fill: none; stroke: var(--ember); stroke-width: 3; opacity: 0; animation: lit 8.0s ease-out infinite; }
    .chip-lit { fill: none; stroke: var(--ember); stroke-width: 1.5; opacity: 0; animation: lit 8.0s ease-out infinite; }
    @keyframes lit { 0% { opacity: 1; } 18%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .tail, .head { display: none; } .lit, .chip-lit { animation: none; } }
    @keyframes ch1 { 0% { stroke-dashoffset: 30; } 58.0%, 100% { stroke-dashoffset: -1042.0; } }
    @keyframes ct1 { 0% { stroke-dashoffset: 152; } 64.7%, 100% { stroke-dashoffset: -1042.0; } }
    @keyframes ch2 { 0% { stroke-dashoffset: 30; } 22.2%, 100% { stroke-dashoffset: -382.6; } }
    @keyframes ct2 { 0% { stroke-dashoffset: 152; } 28.8%, 100% { stroke-dashoffset: -382.6; } }
    @keyframes ch3 { 0% { stroke-dashoffset: 30; } 22.2%, 100% { stroke-dashoffset: -382.6; } }
    @keyframes ct3 { 0% { stroke-dashoffset: 152; } 28.8%, 100% { stroke-dashoffset: -382.6; } }
  </style>
  <defs>
    <linearGradient id="ember" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7AD31"/><stop offset=".48" stop-color="#FA7E26"/><stop offset="1" stop-color="#FC4F1B"/>
    </linearGradient>
    <linearGradient id="heat" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7AD31"/><stop offset=".48" stop-color="#FA7E26"/><stop offset="1" stop-color="#FC4F1B"/>
    </linearGradient>
    <linearGradient id="planned" x1="232" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color: var(--line)"/><stop offset="1" style="stop-color: var(--line); stop-opacity: 0"/>
    </linearGradient>
    <linearGradient id="planned-mini" x1="952" y1="0" x2="1072" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color: var(--line)"/><stop offset="1" style="stop-color: var(--line); stop-opacity: 0"/>
    </linearGradient>
    <clipPath id="panel"><rect width="1200" height="400" rx="16"/></clipPath>
    <radialGradient id="glow" cx="1" cy="0" r="1" gradientTransform="matrix(.75 0 0 1 .25 0)">
      <stop offset="0" style="stop-color: #FA7E26; stop-opacity: var(--glow)"/><stop offset="1" stop-color="#FA7E26" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="27.71" height="32" patternUnits="userSpaceOnUse">
      <g style="fill: var(--dot)"><circle r="1.25"/><circle cx="13.86" cy="16" r="1.25"/><circle cx="27.71" r="1.25"/><circle cy="32" r="1.25"/><circle cx="27.71" cy="32" r="1.25"/></g>
    </pattern>
    <radialGradient id="fade" cx=".8" cy=".15" r=".6"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="fade-mask"><rect width="1200" height="400" fill="url(#fade)"/></mask>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="1200" height="400" fill="var(--bg)"/>
    <rect width="1200" height="400" fill="url(#glow)"/>
    <rect width="1200" height="400" fill="url(#dots)" style="opacity: var(--dots)" mask="url(#fade-mask)"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="398.5" rx="15.25" stroke="var(--border)" stroke-width="1.5"/>

