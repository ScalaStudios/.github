<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-label="Halo: person, passkey, policy, then OIDC, SAML, SCIM, then application and review.">
  <style>
    svg { --bg:#111111;--raised:#1C1917;--border:#2A2724;--line:#44403A;--dot:#FFFFFF;--fg:#FFFFFF;--fg2:#D3D0CC;--fg3:#A8A29B;--ember:#FA7E26;--glow:0.16;--dots:0.16 }
    .label { font: 600 16px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .14em; fill: var(--fg3); }
    .chip-text { font: 600 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .1em; fill: var(--fg2); }
    .base { stroke: var(--line); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .tail, .head { stroke-linecap: round; animation-timing-function: linear; animation-iteration-count: infinite; animation-duration: 8.0s; }
    .tail { stroke: url(#heat); stroke-width: 4; stroke-dasharray: 150 4000; stroke-dashoffset: 152; opacity: .4; }
    .head { stroke: url(#heat); stroke-width: 6; stroke-dasharray: 28 4000; stroke-dashoffset: 30; }
    .stop { fill: var(--bg); stroke: var(--line); stroke-width: 3; }
    .planned { stroke: url(#planned); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 11; }
    .chip { fill: var(--raised); stroke: var(--line); stroke-width: 1.5; }
    .lit { fill: none; stroke: var(--ember); stroke-width: 3; opacity: 0; animation: lit 8.0s ease-out infinite; }
    .chip-lit { fill: none; stroke: var(--ember); stroke-width: 1.5; opacity: 0; animation: lit 8.0s ease-out infinite; }
    @keyframes lit { 0% { opacity: 1; } 18%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .tail, .head { display: none; } .lit, .chip-lit { animation: none; } }
    @keyframes ch1 { 0% { stroke-dashoffset: 30; } 58.0%, 100% { stroke-dashoffset: -1042.0; } }
    @keyframes ct1 { 0% { stroke-dashoffset: 152; } 64.7%, 100% { stroke-dashoffset: -1042.0; } }
    @keyframes ch2 { 0% { stroke-dashoffset: 30; } 22.2%, 100% { stroke-dashoffset: -382.6; } }
    @keyframes ct2 { 0% { stroke-dashoffset: 152; } 28.8%, 100% { stroke-dashoffset: -382.6; } }
    @keyframes ch3 { 0% { stroke-dashoffset: 30; } 22.2%, 100% { stroke-dashoffset: -382.6; } }
    @keyframes ct3 { 0% { stroke-dashoffset: 152; } 28.8%, 100% { stroke-dashoffset: -382.6; } }
  </style>
  <defs>
    <linearGradient id="ember" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7AD31"/><stop offset=".48" stop-color="#FA7E26"/><stop offset="1" stop-color="#FC4F1B"/>
    </linearGradient>
    <linearGradient id="heat" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7AD31"/><stop offset=".48" stop-color="#FA7E26"/><stop offset="1" stop-color="#FC4F1B"/>
    </linearGradient>
    <linearGradient id="planned" x1="232" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color: var(--line)"/><stop offset="1" style="stop-color: var(--line); stop-opacity: 0"/>
    </linearGradient>
    <linearGradient id="planned-mini" x1="952" y1="0" x2="1072" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color: var(--line)"/><stop offset="1" style="stop-color: var(--line); stop-opacity: 0"/>
    </linearGradient>
    <clipPath id="panel"><rect width="1200" height="400" rx="16"/></clipPath>
    <radialGradient id="glow" cx="1" cy="0" r="1" gradientTransform="matrix(.75 0 0 1 .25 0)">
      <stop offset="0" style="stop-color: #FA7E26; stop-opacity: var(--glow)"/><stop offset="1" stop-color="#FA7E26" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="27.71" height="32" patternUnits="userSpaceOnUse">
      <g style="fill: var(--dot)"><circle r="1.25"/><circle cx="13.86" cy="16" r="1.25"/><circle cx="27.71" r="1.25"/><circle cy="32" r="1.25"/><circle cx="27.71" cy="32" r="1.25"/></g>
    </pattern>
    <radialGradient id="fade" cx=".8" cy=".15" r=".6"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="fade-mask"><rect width="1200" height="400" fill="url(#fade)"/></mask>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="1200" height="400" fill="var(--bg)"/>
    <rect width="1200" height="400" fill="url(#glow)"/>
    <rect width="1200" height="400" fill="url(#dots)" style="opacity: var(--dots)" mask="url(#fade-mask)"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="398.5" rx="15.25" stroke="var(--border)" stroke-width="1.5"/>

  <!-- Product -->
  <rect x="80.75" y="64.75" width="62.5" height="62.5" rx="11.25" fill="#111111" stroke="var(--border)" stroke-width="1.5"/><path transform="translate(92 76) scale(1.25)" fill="url(#ember)" d="M18 29.351A13.5 13.5 0 1 0 14 29.351L14 23.228A7.5 7.5 0 1 1 18 23.228Z"/>
  <path fill="var(--fg)" d="M172.2 103.2V64.7H182.2V79.5H197.8V64.7H207.9V103.2H197.8V87.7H182.2V103.2ZM222.7 103.9Q220.8 103.9 219 103.5Q217.3 103.2 215.9 102.2Q214.4 101.3 213.6 99.7Q212.7 98.1 212.7 95.6Q212.7 92.4 214.1 90.4Q215.4 88.4 218 87.2Q220.5 86.1 224.1 85.6Q227.8 85.2 232.2 85.2V83.3Q232.2 82 231.7 81.2Q231.2 80.3 230.2 79.8Q229.3 79.4 227.6 79.4Q226.2 79.4 225.1 79.7Q224 80 223.4 80.7Q222.9 81.3 222.9 82.2V82.7H213.9Q213.9 82.4 213.9 82.2V81.7Q213.9 79.1 215.5 77.1Q217.2 75.2 220.2 74.1Q223.3 73 227.7 73Q231.8 73 234.8 74Q237.9 75 239.7 77.1Q241.4 79.2 241.4 82.5V95.1Q241.4 96.1 241.9 96.7Q242.5 97.2 243.3 97.2H245.2V102.9Q244.6 103.2 243.2 103.5Q241.9 103.9 240.1 103.9Q238.2 103.9 236.7 103.4Q235.3 102.9 234.4 102.1Q233.5 101.2 233.1 100H232.7Q231.7 101.1 230.2 102Q228.8 102.9 226.9 103.4Q225.1 103.9 222.7 103.9ZM226.1 97.6Q227.4 97.6 228.5 97.2Q229.7 96.8 230.5 96.1Q231.3 95.4 231.8 94.4Q232.2 93.4 232.2 92.2V90.2Q229 90.2 226.7 90.7Q224.4 91.1 223.2 92.1Q222 93 222 94.5Q222 95.5 222.5 96.2Q223 96.9 223.9 97.2Q224.8 97.6 226.1 97.6ZM247.8 103.2V62.7H257V103.2ZM277.1 103.9Q272.2 103.9 268.7 102.2Q265.2 100.5 263.3 97.1Q261.4 93.6 261.4 88.4Q261.4 83.2 263.3 79.8Q265.2 76.4 268.7 74.7Q272.2 73 277.1 73Q282.1 73 285.6 74.7Q289.1 76.4 290.9 79.8Q292.8 83.2 292.8 88.4Q292.8 93.6 290.9 97.1Q289.1 100.5 285.6 102.2Q282.1 103.9 277.1 103.9ZM277.1 97.2Q279.4 97.2 280.8 96.3Q282.2 95.4 282.9 93.7Q283.5 92 283.5 89.5V87.4Q283.5 84.9 282.9 83.2Q282.2 81.4 280.8 80.6Q279.4 79.7 277.1 79.7Q274.8 79.7 273.4 80.6Q272 81.4 271.3 83.2Q270.7 84.9 270.7 87.4V89.5Q270.7 92 271.3 93.7Q272 95.4 273.4 96.3Q274.8 97.2 277.1 97.2Z"/>
  <text class="label" x="168" y="133.2">IDENTITY AND ACCESS MANAGEMENT</text>
  <g stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"><path stroke="var(--line)" d="M928 96L948 96Q952 96 955.5 94L965.9 88Q969.3 86 973.3 86L1120 86"/><circle cx="1120" cy="86" r="4" fill="var(--bg)" stroke="var(--line)"/><path stroke="url(#planned-mini)" stroke-dasharray="1 7" d="M952 96L1076.8 96"/><path stroke="url(#planned-mini)" stroke-dasharray="1 7" d="M952 96L965.9 104Q969.3 106 973.3 106L1070.4 106"/><path stroke="url(#planned-mini)" stroke-dasharray="1 7" d="M952 96L983.2 114Q986.6 116 990.6 116L1064 116"/><path stroke="var(--ember)" d="M928 96L948 96Q952 96 955.5 94L983.2 78Q986.6 76 990.6 76L1120 76"/><circle cx="1120" cy="76" r="4" fill="var(--bg)" stroke="var(--ember)"/><circle cx="928" cy="96" r="5" fill="var(--bg)" stroke="var(--line)"/></g>

  <!-- Halo: one line with labelled stops and a three-way split -->
  <path class="base" d="M80 264L1120 264"/>
  <path class="base" d="M456 264L539.1 216Q553 208 569 208L695 208Q711 208 724.9 216L808 264"/>
  <path class="base" d="M456 264L539.1 312Q553 320 569 320L695 320Q711 320 724.9 312L808 264"/>
  <path class="tail" style="animation-name: ct1;" d="M80 264L1120 264"/>
  <path class="head" style="animation-name: ch1;" d="M80 264L1120 264"/>
  <path class="tail" style="animation-name: ct2; animation-delay: 1.63s;" d="M456 264L539.1 216Q553 208 569 208L695 208Q711 208 724.9 216L808 264"/>
  <path class="head" style="animation-name: ch2; animation-delay: 1.63s;" d="M456 264L539.1 216Q553 208 569 208L695 208Q711 208 724.9 216L808 264"/>
  <path class="tail" style="animation-name: ct3; animation-delay: 1.63s;" d="M456 264L539.1 312Q553 320 569 320L695 320Q711 320 724.9 312L808 264"/>
  <path class="head" style="animation-name: ch3; animation-delay: 1.63s;" d="M456 264L539.1 312Q553 320 569 320L695 320Q711 320 724.9 312L808 264"/>
  <circle class="stop" cx="80" cy="264" r="11"/>
  <circle class="lit" cx="80" cy="264" r="11" style="animation-delay: 0.06s"/>
  <text class="label" x="80" y="236" text-anchor="start">PERSON</text>
  <circle class="stop" cx="232" cy="264" r="7"/>
  <circle class="lit" cx="232" cy="264" r="7" style="animation-delay: 0.74s"/>
  <text class="label" x="232" y="236" text-anchor="middle">PASSKEY</text>
  <circle class="stop" cx="384" cy="264" r="7"/>
  <circle class="lit" cx="384" cy="264" r="7" style="animation-delay: 1.37s"/>
  <text class="label" x="384" y="236" text-anchor="middle">POLICY</text>
  <circle class="stop" cx="904" cy="264" r="7"/>
  <circle class="lit" cx="904" cy="264" r="7" style="animation-delay: 3.63s"/>
  <text class="label" x="904" y="236" text-anchor="middle">APPLICATION</text>
  <circle class="stop" cx="1120" cy="264" r="11"/>
  <circle class="lit" cx="1120" cy="264" r="11" style="animation-delay: 4.58s"/>
  <text class="label" x="1120" y="236" text-anchor="end">REVIEW</text>
  <rect class="chip" x="595.8" y="192" width="72.5" height="32" rx="8"/>
  <rect class="chip-lit" x="595.8" y="192" width="72.5" height="32" rx="8" style="animation-delay: 2.52s"/>
  <text class="chip-text" x="632" y="213" text-anchor="middle">OIDC</text>
  <rect class="chip" x="595.8" y="248" width="72.5" height="32" rx="8"/>
  <rect class="chip-lit" x="595.8" y="248" width="72.5" height="32" rx="8" style="animation-delay: 2.46s"/>
  <text class="chip-text" x="632" y="269" text-anchor="middle">SAML</text>
  <rect class="chip" x="595.8" y="304" width="72.5" height="32" rx="8"/>
  <rect class="chip-lit" x="595.8" y="304" width="72.5" height="32" rx="8" style="animation-delay: 2.52s"/>
  <text class="chip-text" x="632" y="325" text-anchor="middle">SCIM</text>
</svg>
